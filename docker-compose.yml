services:
  # 1. PostgreSQL Ma'lumotlar bazasi
  db:
    image: postgres:16-alpine
    container_name: ai_inbox_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-ai_inbox_db}
      POSTGRES_USER: ${DB_USER:-ai_inbox_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-strongpassword123}
    ports:
      - "5454:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ai_inbox_user} -d ${DB_NAME:-ai_inbox_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis (Broker & Cache)
  redis:
    image: redis:7-alpine
    container_name: ai_inbox_redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Django Web Server
  web:
    build: .
    container_name: ai_inbox_web
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. Celery Worker (Asinxron navbatlar)
  celery_worker:
    build: .
    container_name: ai_inbox_celery_worker
    restart: always
    command: celery -A ai_inbox_backend worker --loglevel=info -Q webhooks,messages,notifications,maintenance
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 5. Celery Beat (Data Retention periodic task)
  celery_beat:
    build: .
    container_name: ai_inbox_celery_beat
    restart: always
    command: celery -A ai_inbox_backend beat --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
